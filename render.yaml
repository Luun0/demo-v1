services:
  - type: web
    name: sen-support-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.online
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: API_ADDR
        value: ":8081"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PASSWORD_RESET_LOG_LINK
        value: "false"
      - key: AUTO_MIGRATE
        value: "false"
