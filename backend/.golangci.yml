version: "2"
linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - misspell
    - depguard
  settings:
    depguard:
      rules:
        # ADR-0001: inner layers must not know about HTTP, SQL drivers or JWT.
        inner-layers:
          files:
            - "**/internal/domain/**"
            - "**/internal/application/**"
          deny:
            - pkg: net/http
              desc: "domain/application must not depend on HTTP"
            - pkg: github.com/jackc/pgx
              desc: "domain/application must not depend on the database driver"
            - pkg: github.com/golang-jwt/jwt
              desc: "domain/application must not depend on token formats"
            - pkg: github.com/AknurOE/sen-support-platform/internal/adapter
              desc: "dependencies point inwards"
            - pkg: github.com/AknurOE/sen-support-platform/internal/infrastructure
              desc: "dependencies point inwards"
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
      - path: internal/testpg/
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
