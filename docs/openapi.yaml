openapi: 3.0.3
info:
  title: SEN Support Platform API
  version: 0.2.0
  description: Draft API contract derived from docs/srs.md, the access matrix, security/privacy requirements, data
    inventory, backend/internal/domain, and docs/diagrams/er.mmd. Bearer JWT is used for authenticated API requests.
    Login and refresh use JSON request and response bodies for their credentials and tokens. A child resource without
    an active relationship returns 404 (SEC-11); an existing relationship without the required permission returns
    403. Invalid fields return 422. Parent diary writes are limited to shared; Parent reads and exports never include
    specialists_only. Admin responses never include diary content. Guest can only register and sign in. Errors use
    application/problem+json (RFC 9457). Refresh tokens travel only in an HttpOnly cookie (ADR-0004).
  license:
    name: All rights reserved (TODO)
    url: https://example.invalid/license-todo
servers:
- url: /api/v1
  description: API base path; deployment host is not specified in source documents.
tags:
- name: auth
  description: Registration, login, token refresh and logout
- name: users
  description: Admin account management
- name: child profile
  description: Child records and consent
- name: guardian and specialist links
  description: Relationships that grant object-level access
- name: sessions
  description: Support sessions
- name: diary
  description: Versioned diary entries with visibility
- name: audit
  description: Audit metadata (never diary text)
- name: export
  description: Data export and deletion
- name: ops
  description: Health and readiness probes
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - auth
      summary: Register a Parent or an approved Specialist
      description: 'FR-01, SC-01; SEC-01, SEC-02, SEC-13, SEC-14. Guest may register only as

        Parent or an already approved Specialist; public registration cannot

        create Admin. Example request: `{"email":"parent@example.test","password":"example-password","first_name":"Aida","last_name":"S.","role":"parent"}`.

        Example response (201): `{"id":"00000000-0000-4000-8000-000000000001","email":"parent@example.test","first_name":"Aida","last_name":"S.","role":"parent","status":"active","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
            example:
              email: parent@example.test
              password: example-password
              first_name: Aida
              last_name: S.
              role: parent
      responses:
        '201':
          description: User registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postAuthRegister
  /auth/login:
    post:
      tags:
      - auth
      summary: Sign in
      description: 'FR-01, SC-01; SEC-03, SEC-04, SEC-05, SEC-08, AUD-05. Failure uses a

        generic response for unknown email and wrong password; rate limiting may

        return 429. Example request: `{"email":"parent@example.test","password":"example-password"}`.

        Example response (200): `{"access_token":"eyJ...","token_type":"Bearer","expires_in":900}` plus Set-Cookie.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: parent@example.test
              password: example-password
      responses:
        '200':
          description: Access token in body; refresh token in HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: ssp_refresh (HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth) and ssp_csrf cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postAuthLogin
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Rotate the refresh token (cookie)
      description: SEC-05, SEC-06, AUD-05. Reads ssp_refresh cookie, rotates it. Reuse of a rotated token revokes
        the whole token family (ADR-0004).
      security:
      - refreshCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Access token in body; refresh token in HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: ssp_refresh (HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth) and ssp_csrf cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
      operationId: postAuthRefresh
  /auth/logout:
    post:
      tags:
      - auth
      summary: End the current session
      description: SEC-06, AUD-05. Revokes the refresh token family from the cookie and clears cookies. Idempotent.
      security:
      - refreshCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session ended.
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postAuthLogout
  /users:
    post:
      tags:
      - users
      summary: Create a user account
      description: 'FR-13, SC-07; SEC-10, SEC-13, SEC-14, AUD-05. Admin only. User metadata only, no diary text.
        Public

        registration remains limited to Parent and approved Specialist roles;

        this operation lets an Admin manage accounts. Example request:

        `{"email":"specialist@example.test","password":"example-password","first_name":"Dana","last_name":"K.","role":"specialist"}`.

        Example response (201): `{"id":"00000000-0000-4000-8000-000000000003","email":"specialist@example.test","first_name":"Dana","last_name":"K.","role":"specialist","status":"active","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreate'
            example:
              email: specialist@example.test
              password: example-password
              first_name: Dana
              last_name: K.
              role: specialist
      responses:
        '201':
          description: User account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postUsers
    get:
      tags:
      - users
      summary: List users (admin)
      operationId: getUsers
      parameters:
      - $ref: '#/components/parameters/Limit'
      - name: cursor
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Users without credential or lockout fields (S1).
          headers:
            X-Next-Cursor:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - users
      summary: Deactivate a user account
      description: 'FR-13, SC-07; SEC-08, SEC-10, AUD-05. Admin only. Sets User.status to

        `inactive`; subsequent requests with existing tokens are rejected. Admin response is metadata only, no diary
        text.

        Example request: `{"status":"inactive"}`. Example response (200):

        `{"id":"00000000-0000-4000-8000-000000000003","email":"specialist@example.test","first_name":"Dana","last_name":"K.","role":"specialist","status":"inactive","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T11:00:00Z"}`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDeactivation'
            example:
              status: inactive
      responses:
        '200':
          description: User deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: patchUsersUserId
  /audit-events:
    get:
      tags:
      - audit
      summary: Read system audit events
      description: 'FR-14, SC-06, SC-07; SEC-10, SEC-15, AUD-04, AUD-05. Admin only; the

        response is metadata only, no diary text. Example request:

        `GET /audit-events`. Example response (200):

        `[{"id":"50000000-0000-4000-8000-000000000001","actor_id":"00000000-0000-4000-8000-000000000003","child_id":null,"action":"login","resource":"user","resource_id":"00000000-0000-4000-8000-000000000003","outcome":"success","request_id":"r-1","occurred_at":"2026-10-23T10:00:00Z"}]`.

        '
      responses:
        '200':
          description: System audit metadata only, no diary text.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      operationId: getAuditEvents
  /children:
    get:
      tags:
      - child profile
      summary: List linked child profiles
      description: 'FR-02, FR-15, SC-02; SEC-11, SEC-15. Parent and Specialist receive

        profiles only for active relationships. Admin receives metadata only,

        no diary text. Example request: `GET /children`. Example response (200):

        `[{"id":"10000000-0000-4000-8000-000000000001","first_name":"Mira","last_name":"S.","birth_date":"2018-04-12","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}]`.

        '
      responses:
        '200':
          description: Linked children; for Admin, metadata only, no diary text.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getChildren
    post:
      tags:
      - child profile
      summary: Create a child profile
      description: 'FR-02, SC-02; PRV-07, SEC-10, SEC-11, AUD-01. Parent only. A consent

        record is created with the authenticated guardian and policy version;

        consent time is recorded by the server. Example request:

        `{"first_name":"Mira","last_name":"S.","birth_date":"2018-04-12","policy_version":"v1"}`.

        Example response (201): `{"id":"10000000-0000-4000-8000-000000000001","first_name":"Mira","last_name":"S.","birth_date":"2018-04-12","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildRegistration'
            example:
              first_name: Mira
              last_name: S.
              birth_date: '2018-04-12'
              policy_version: v1
      responses:
        '201':
          description: Child created with a ConsentRecord.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postChildren
  /children/{childId}:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    get:
      tags:
      - child profile
      summary: Read child profile
      description: 'FR-02, FR-15, SC-02; SEC-11. Parent and Specialist need an active

        relationship; Admin receives metadata only, no diary text. No relationship, including

        an ended assignment, returns 404; insufficient rights on an existing

        relationship returns 403. Example request: `GET /children/10000000-0000-4000-8000-000000000001`.

        Example response (200): `{"id":"10000000-0000-4000-8000-000000000001","first_name":"Mira","last_name":"S.","birth_date":"2018-04-12","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}`.

        '
      responses:
        '200':
          description: Child profile fields permitted for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getChildrenChildId
    patch:
      tags:
      - child profile
      summary: Update child profile
      description: 'FR-02, SC-02; SEC-11, SEC-20, AUD-01. Only a primary Parent with an

        active relationship may change the profile. No relationship returns

        404; a linked non-primary Parent, Specialist or Admin returns 403.

        Example request: `{"first_name":"Mira","birth_date":"2018-04-12"}`.

        Example response (200): `{"id":"10000000-0000-4000-8000-000000000001","first_name":"Mira","last_name":"S.","birth_date":"2018-04-12","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T11:00:00Z"}`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildProfileUpdate'
            example:
              first_name: Mira
              birth_date: '2018-04-12'
      responses:
        '200':
          description: Updated child profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: patchChildrenChildId
    delete:
      tags:
      - export
      summary: Delete child data
      description: FR-12, PRV-05. Primary guardian or Admin (audited). No relationship returns 404.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: deleteChildrenChildId
  /children/{childId}/guardians:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    post:
      tags:
      - guardian and specialist links
      summary: Link a guardian
      description: 'FR-03, SC-07; SEC-11, SEC-13, AUD-01. Primary Parent for a related

        child or Admin may create the link; Admin response is metadata only, no diary text. No Parent relationship
        returns 404;

        an existing relationship without primary rights returns 403. Example

        request: `{"guardian_id":"00000000-0000-4000-8000-000000000002","relationship":"guardian","is_primary":false}`.

        Example response (201): `{"child_id":"10000000-0000-4000-8000-000000000001","guardian_id":"00000000-0000-4000-8000-000000000002","relationship":"guardian","is_primary":false,"created_at":"2026-10-23T10:00:00Z"}`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianLinkInput'
            example:
              guardian_id: 00000000-0000-4000-8000-000000000002
              relationship: guardian
              is_primary: false
      responses:
        '201':
          description: Guardian link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildGuardian'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postChildrenChildIdGuardians
  /children/{childId}/specialist-assignments:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    post:
      tags:
      - guardian and specialist links
      summary: Assign a specialist
      description: 'FR-03, SC-07; SEC-11, SEC-14, AUD-01. Primary Parent for a related

        child or Admin may assign an approved Specialist; Admin response is metadata only, no diary text. No Parent
        relationship

        returns 404; an existing relationship without primary rights returns

        403. The actor and assignment time are server-derived. Example request:

        `{"specialist_id":"00000000-0000-4000-8000-000000000003"}`. Example response (201):

        `{"child_id":"10000000-0000-4000-8000-000000000001","specialist_id":"00000000-0000-4000-8000-000000000003","assigned_by":"00000000-0000-4000-8000-000000000001","assigned_at":"2026-10-23T10:00:00Z","ended_at":null}`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialistAssignmentInput'
            example:
              specialist_id: 00000000-0000-4000-8000-000000000003
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildSpecialist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postChildrenChildIdSpecialistAssignments
  /children/{childId}/specialist-assignments/{specialistId}:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    - name: specialistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - guardian and specialist links
      summary: End a specialist assignment
      description: 'FR-03, SC-07; SEC-11, AUD-01. Primary Parent for a related child or

        Admin may set ended_at; Admin response is metadata only, no diary text. Revocation is effective on the next
        request,

        including a request with an earlier JWT. No relationship returns 404;

        insufficient rights returns 403. Example request:

        `{"ended_at":"2026-10-23T11:00:00Z"}`. Example response (200):

        `{"child_id":"10000000-0000-4000-8000-000000000001","specialist_id":"00000000-0000-4000-8000-000000000003","assigned_by":"00000000-0000-4000-8000-000000000001","assigned_at":"2026-10-23T10:00:00Z","ended_at":"2026-10-23T11:00:00Z"}`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentEndInput'
            example:
              ended_at: '2026-10-23T11:00:00Z'
      responses:
        '200':
          description: Ended assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildSpecialist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: patchChildrenChildIdSpecialistAssignmentsSpecialistId
  /children/{childId}/sessions:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    get:
      tags:
      - sessions
      summary: List support sessions
      description: 'FR-04, SC-03; SEC-11, AUD-01. Parent or Specialist with an active

        relationship may read permitted fields. Admin has no individual session

        access. No relationship returns 404; a linked role without permission

        returns 403. Example request: `GET /children/10000000-0000-4000-8000-000000000001/sessions`.

        Example response (200): `[{"id":"20000000-0000-4000-8000-000000000001","child_id":"10000000-0000-4000-8000-000000000001","specialist_id":"00000000-0000-4000-8000-000000000003","created_by":"00000000-0000-4000-8000-000000000001","title":"Weekly
        support","starts_at":"2026-10-24T09:00:00Z","ends_at":"2026-10-24T10:00:00Z","mode":"online","status":"scheduled","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}]`.

        '
      responses:
        '200':
          description: Sessions permitted to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getChildrenChildIdSessions
    post:
      tags:
      - sessions
      summary: Create a support session
      description: 'FR-05, SC-03; SEC-11, SEC-20, AUD-01. Parent or Specialist with an

        active relationship may create a session; actor and child context are

        server-derived. No relationship returns 404; forbidden role/action

        returns 403; invalid interval, mode or status returns 422. Example

        request: `{"specialist_id":"00000000-0000-4000-8000-000000000003","title":"Weekly support","starts_at":"2026-10-24T09:00:00Z","ends_at":"2026-10-24T10:00:00Z","mode":"online","status":"scheduled"}`.

        Example response (201): `{"id":"20000000-0000-4000-8000-000000000001","child_id":"10000000-0000-4000-8000-000000000001","specialist_id":"00000000-0000-4000-8000-000000000003","created_by":"00000000-0000-4000-8000-000000000001","title":"Weekly
        support","starts_at":"2026-10-24T09:00:00Z","ends_at":"2026-10-24T10:00:00Z","mode":"online","status":"scheduled","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportSessionInput'
            example:
              specialist_id: 00000000-0000-4000-8000-000000000003
              title: Weekly support
              starts_at: '2026-10-24T09:00:00Z'
              ends_at: '2026-10-24T10:00:00Z'
              mode: online
              status: scheduled
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postChildrenChildIdSessions
  /children/{childId}/sessions/{sessionId}:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - sessions
      summary: Update or cancel a support session
      description: 'FR-05, SC-03; SEC-11, SEC-20, AUD-01. Parent with an active relationship

        or the assigned Specialist may update permitted fields or set status to

        `cancelled`. Admin has no individual session access. No relationship

        returns 404; insufficient rights returns 403; invalid data returns 422.

        Example request: `{"status":"cancelled"}`. Example response (200):

        `{"id":"20000000-0000-4000-8000-000000000001","child_id":"10000000-0000-4000-8000-000000000001","specialist_id":"00000000-0000-4000-8000-000000000003","created_by":"00000000-0000-4000-8000-000000000001","title":"Weekly
        support","starts_at":"2026-10-24T09:00:00Z","ends_at":"2026-10-24T10:00:00Z","mode":"online","status":"cancelled","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T11:00:00Z"}`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportSessionUpdate'
            example:
              status: cancelled
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: patchChildrenChildIdSessionsSessionId
  /children/{childId}/diary-entries:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    get:
      tags:
      - diary
      summary: List diary entries
      description: 'FR-07, SC-04; SEC-11, SEC-12, SEC-15, AUD-01. Parent receives shared

        entries only; Specialist with an active relationship may receive both

        visibility values; Admin never receives content. No relationship

        returns 404; a related actor lacking permission returns 403. Example

        request: `GET /children/10000000-0000-4000-8000-000000000001/diary-entries`. Example response (200):

        `[{"id":"30000000-0000-4000-8000-000000000001","child_id":"10000000-0000-4000-8000-000000000001","author_id":"00000000-0000-4000-8000-000000000001","type":"observation","visibility":"shared","content":"Joined
        the activity.","observed_at":"2026-10-23T09:00:00Z","created_at":"2026-10-23T09:01:00Z","updated_at":"2026-10-23T09:01:00Z"}]`.

        '
      responses:
        '200':
          description: Visibility-filtered entries; never includes Admin diary content.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiaryEntry'
          headers:
            X-Next-Cursor:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
              description: Count of entries visible to the caller only.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
        description: Case-insensitive search in visible entries only.
      - name: visibility
        in: query
        schema:
          type: string
          enum:
          - shared
          - specialists_only
      operationId: getChildrenChildIdDiaryEntries
    post:
      tags:
      - diary
      summary: Create a diary entry
      description: 'FR-06, SC-04; SEC-11, SEC-12, SEC-13, SEC-20, AUD-01. Parent may write

        only `shared`; Specialist with an active relationship may choose either

        visibility. A Parent asking for `specialists_only` is forbidden (403);

        an unknown visibility/type or missing required value is invalid (422).

        No relationship returns 404. Author and child are server-derived.

        Example request: `{"type":"observation","visibility":"shared","content":"Joined the activity.","observed_at":"2026-10-23T09:00:00Z"}`.

        Example response (201): `{"id":"30000000-0000-4000-8000-000000000001","child_id":"10000000-0000-4000-8000-000000000001","author_id":"00000000-0000-4000-8000-000000000001","type":"observation","visibility":"shared","content":"Joined
        the activity.","observed_at":"2026-10-23T09:00:00Z","created_at":"2026-10-23T09:01:00Z","updated_at":"2026-10-23T09:01:00Z"}`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryEntryInput'
            example:
              type: observation
              visibility: shared
              content: Joined the activity.
              observed_at: '2026-10-23T09:00:00Z'
      responses:
        '201':
          description: Diary entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postChildrenChildIdDiaryEntries
  /children/{childId}/diary-entries/{entryId}:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    - name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      tags:
      - diary
      summary: Update an authored diary entry
      description: 'FR-08, SC-04, SC-05; SEC-11, SEC-12, SEC-20, AUD-01, AUD-03. Parent or

        Specialist may edit only their own entry, subject to visibility; each

        edit preserves the prior version. Parent writes remain `shared` only.

        No relationship returns 404; a linked actor without edit rights returns

        403. Invalid data returns 422. Example request:

        `{"type":"progress","visibility":"shared","content":"Completed the task.","observed_at":"2026-10-23T09:00:00Z"}`.

        Example response (200): `{"id":"30000000-0000-4000-8000-000000000001","child_id":"10000000-0000-4000-8000-000000000001","author_id":"00000000-0000-4000-8000-000000000001","type":"progress","visibility":"shared","content":"Completed
        the task.","observed_at":"2026-10-23T09:00:00Z","created_at":"2026-10-23T09:01:00Z","updated_at":"2026-10-23T10:00:00Z"}`;
        prior state appears in history.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryEntryInput'
            example:
              type: progress
              visibility: shared
              content: Completed the task.
              observed_at: '2026-10-23T09:00:00Z'
      responses:
        '200':
          description: Updated current entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: putChildrenChildIdDiaryEntriesEntryId
    delete:
      tags:
      - diary
      summary: Delete an authored parent diary entry
      description: Parents may delete only their own entries. Specialists' observations are retained. The action is audited.
      responses:
        '204':
          description: Entry deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: deleteChildrenChildIdDiaryEntriesEntryId
  /children/{childId}/diary-entries/{entryId}/versions:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    - name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - diary
      summary: Read diary entry history
      description: 'FR-08, SC-05; SEC-11, SEC-12, SEC-15, AUD-01, AUD-03. History uses the

        same relationship, ownership and visibility rules as the current entry.

        Parent sees versions only for shared entries; Admin never sees diary content. No

        relationship returns 404; insufficient rights returns 403. Example

        request: `GET /children/10000000-0000-4000-8000-000000000001/diary-entries/30000000-0000-4000-8000-000000000001/versions`.
        Example response

        (200): `[{"id":"40000000-0000-4000-8000-000000000001","entry_id":"30000000-0000-4000-8000-000000000001","version_number":1,"changed_by":"00000000-0000-4000-8000-000000000001","type":"observation","visibility":"shared","content":"Joined
        the activity.","observed_at":"2026-10-23T09:00:00Z","changed_at":"2026-10-23T09:01:00Z"}]`.

        '
      responses:
        '200':
          description: Authorized immutable diary snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiaryEntryVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getChildrenChildIdDiaryEntriesEntryIdVersions
  /children/{childId}/audit-events:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    get:
      tags:
      - audit
      summary: Read permitted audit events for a child
      description: 'FR-09, FR-14, SC-06, SC-07; SEC-11, SEC-15, AUD-01, AUD-04. A related

        Parent may see access events for that child; Admin may see permitted

        audit metadata only, no diary text. No Parent relationship returns 404; other insufficient

        rights return 403. Response excludes source_ip and attempted identifier

        keys. Example request: `GET /children/10000000-0000-4000-8000-000000000001/audit-events`. Example response

        (200): `[{"id":"50000000-0000-4000-8000-000000000001","actor_id":"00000000-0000-4000-8000-000000000003","child_id":"10000000-0000-4000-8000-000000000001","action":"read","resource":"diary_entry","resource_id":"30000000-0000-4000-8000-000000000001","outcome":"success","request_id":"r-1","occurred_at":"2026-10-23T10:00:00Z"}]`.

        '
      responses:
        '200':
          description: Permitted audit fields only; no diary content or credential data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      operationId: getChildrenChildIdAuditEvents
  /children/{childId}/exports:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    post:
      tags:
      - export
      summary: Export permitted child records
      description: 'FR-12, SC-08; SEC-11, SEC-12, SEC-15, PRV-05, AUD-01. Primary Parent

        with an active relationship may export profile, sessions and `shared`

        diary entries. `specialists_only` content is excluded. Admin may not

        request this guardian export; for Admin, metadata only, no diary text; Admin exports are metadata-only and
        are

        outside this operation. No relationship returns 404; linked non-primary

        Parent returns 403. Example request: `POST /children/10000000-0000-4000-8000-000000000001/exports` with

        empty body. Example response (200): `[{"id":"10000000-0000-4000-8000-000000000001","first_name":"Mira","last_name":"S.","birth_date":"2018-04-12","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}]`;
        additional array items are permitted sessions and shared diary entries.

        '
      responses:
        '200':
          description: Exported permitted records as JSON; contains no non-ER fields.
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                  - $ref: '#/components/schemas/Child'
                  - $ref: '#/components/schemas/SupportSession'
                  - $ref: '#/components/schemas/DiaryEntry'
              example:
              - id: 10000000-0000-4000-8000-000000000001
                first_name: Mira
                last_name: S.
                birth_date: '2018-04-12'
                created_at: '2026-10-23T10:00:00Z'
                updated_at: '2026-10-23T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postChildrenChildIdExports
  /auth/me:
    get:
      tags:
      - auth
      summary: Current user
      responses:
        '200':
          description: Own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getAuthMe
  /auth/password-reset/request:
    post:
      tags:
      - auth
      summary: Request a password reset (planned)
      x-status: planned
      description: Always 202 regardless of whether the email exists. Email delivery is out of MVP implementation
        scope (ADR-0007).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Accepted
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
      operationId: postAuthPasswordResetRequest
  /auth/password-reset/confirm:
    post:
      tags:
      - auth
      summary: Confirm a password reset (planned)
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 10
                  writeOnly: true
      responses:
        '204':
          description: Password changed; all sessions revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
      operationId: postAuthPasswordResetConfirm
  /healthz:
    get:
      tags:
      - ops
      summary: Liveness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      operationId: getHealthz
  /readyz:
    get:
      tags:
      - ops
      summary: Readiness (database reachable)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      operationId: getReadyz
  /children/{childId}/team:
    parameters:
    - $ref: '#/components/parameters/ChildId'
    get:
      tags:
      - guardian and specialist links
      operationId: getChildTeam
      summary: Guardians and specialist assignments (names only, ADR-0009)
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /specialists:
    get:
      tags:
      - guardian and specialist links
      operationId: getSpecialists
      summary: Directory of approved specialists (parent, admin)
      responses:
        '200':
          description: Approved active specialists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecialistSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: ssp_refresh
  parameters:
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: Double-submit token; must equal the ssp_csrf cookie (ADR-0004).
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from the X-Next-Cursor response header (ADR-0006).
  responses:
    Unauthorized:
      description: Missing/invalid bearer JWT or invalid credentials; generic auth failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Relationship exists but role or right is insufficient.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or no active relationship; existence is not confirmed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidData:
      description: Request fields are missing, malformed, or outside the allowed domain values.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict (e.g. duplicate email, already ended assignment).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body exceeds the configured limit (SEC-23).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited or temporarily locked (SEC-03). Retry-After header is set.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Registration:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - first_name
      - last_name
      - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          writeOnly: true
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum:
          - parent
          - specialist
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    AdminUserCreate:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - first_name
      - last_name
      - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          writeOnly: true
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum:
          - parent
          - specialist
          - admin
        specialist_approved:
          type: boolean
          default: false
    UserDeactivation:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'Admin update: deactivate/reactivate or approve a specialist (ADR-0007).'
      properties:
        status:
          type: string
          enum:
          - active
          - inactive
        specialist_approved:
          type: boolean
    ChildRegistration:
      type: object
      additionalProperties: false
      required:
      - first_name
      - last_name
      - birth_date
      - policy_version
      properties:
        first_name:
          type: string
        last_name:
          type: string
        birth_date:
          type: string
          format: date
        policy_version:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum:
          - parent
          - specialist
          - admin
        status:
          type: string
          enum:
          - active
          - inactive
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        specialist_approved:
          type: boolean
          description: Present for specialists only.
      required:
      - id
      - email
      - first_name
      - last_name
      - role
      - status
      - created_at
      - updated_at
    Child:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        birth_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - first_name
      - last_name
      - birth_date
      - created_at
      - updated_at
    ChildProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        first_name:
          type: string
        last_name:
          type: string
        birth_date:
          type: string
          format: date
    GuardianLinkInput:
      type: object
      additionalProperties: false
      required:
      - guardian_id
      - relationship
      - is_primary
      properties:
        guardian_id:
          type: string
          format: uuid
        relationship:
          type: string
          enum:
          - parent
          - guardian
        is_primary:
          type: boolean
    ChildGuardian:
      type: object
      properties:
        child_id:
          type: string
          format: uuid
