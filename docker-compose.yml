# Local, prod-like stack. Synthetic data only (PRV-08). Copy .env.example to .env first.
name: sen-support-platform

x-api-env: &api-env
  DATABASE_URL: postgres://ssp_app:${DB_APP_PASSWORD:?set in .env}@db:5432/${DB_NAME:?set in .env}?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:?set in .env (>= 32 bytes)}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  AUTO_MIGRATE: "false"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # never exposed beyond localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: ["migrate"]
    environment:
      <<: *api-env
      DATABASE_URL: postgres://${DB_USER:?set in .env}:${DB_PASSWORD:?set in .env}@db:5432/${DB_NAME:?set in .env}?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    command: ["serve"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
      additional_contexts:
        deploy: ./deploy
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"

volumes:
  postgres_data:
