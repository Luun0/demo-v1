name: ZAP baseline

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start synthetic deployment
        run: docker compose --env-file .env.example up --build -d
      - name: Seed synthetic users and data
        run: docker compose --env-file .env.example run --rm api seed
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8081
          allow_issue_writing: false
