name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rbac-idor:
    name: RBAC and IDOR first
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ssp_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d ssp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ssp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Run access matrix and IDOR tests first
        working-directory: backend
        run: go test ./internal/domain/policy ./tests/integration -run 'TestAccessMatrix100PercentCells|TestCrossFamilyIDORReturns404OnEveryEndpoint'

  quality:
    needs: rbac-idor
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ssp_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d ssp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ssp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Go linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: npm ci --prefix frontend
      - run: make check

  images:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Compose images
        run: docker compose --env-file .env.example build
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sen-support-platform-api
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sen-support-platform-web
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
